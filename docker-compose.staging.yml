services:
  postgres:
    image: postgres:18-alpine
    container_name: company-report-postgres-staging
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-company_report_db}
      POSTGRES_USER: ${DB_USER:-company_report_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-company_report_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - company_report_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-company_report_user} -d $${POSTGRES_DB:-company_report_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - company-report-staging-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.staging
    image: company-report-server:staging
    container_name: company-report-server-staging
    restart: always
    environment:
      APP_ENV: staging
      PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-company_report_db}
      DB_USER: ${DB_USER:-company_report_user}
      DB_PASSWORD: ${DB_PASSWORD:-company_report_secret}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - company-report-staging-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.staging
    image: company-report-nginx:staging
    container_name: company-report-nginx-staging
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - server
    networks:
      - company-report-staging-network

volumes:
  company_report_postgres_staging_data:

networks:
  company-report-staging-network:
    name: company-report-staging-network
    driver: bridge
