services:
  postgres:
    image: postgres:18-alpine
    container_name: company-report-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-company_report_db}
      POSTGRES_USER: ${DB_USER:-company_report_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-company_report_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - company_report_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-company_report_user} -d $${POSTGRES_DB:-company_report_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - company-report-dev-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: company-report-server:dev
    container_name: company-report-server-dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-company_report_app_dev_jwt_secret_key_2026_very_secure_string_min_32_bytes}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-company_report_db}
      DB_USER: ${DB_USER:-company_report_user}
      DB_PASSWORD: ${DB_PASSWORD:-company_report_secret}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "${SERVER_PORT_EXTERNAL:-8090}:8080"
    volumes:
      - ./server:/app
      - company_report_go_mod_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - company-report-dev-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: company-report-nginx:dev
    container_name: company-report-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - company-report-dev-net

volumes:
  company_report_postgres_dev_data:
  company_report_go_mod_cache:

networks:
  company-report-dev-net:
    name: company-report-dev-network
    driver: bridge
